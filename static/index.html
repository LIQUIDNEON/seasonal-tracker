<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seasonal Tracker</title>
  <link rel="stylesheet" href="/style.css?v=bar2" />
  <link rel="stylesheet" href="/compact.css?v=bar2" />
  <style>
    .statusbar {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: space-between !important;
      height: 32px !important;
      max-height: 32px !important;
      overflow: hidden !important;
    }
    .statusbar .ranges { margin-right: auto !important; flex-wrap: nowrap !important; }
    .statusbar .tools { margin-left: auto !important; flex-wrap: nowrap !important; }
    #range-label, #season-chip, .bar-label, .season-chip, .statusline, #btn-minimal {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="board" class="board"></main>
    <footer class="statusbar" id="chrome">
      <nav class="ranges" id="ranges">
        <button type="button" data-range="today" class="active">Today</button>
        <button type="button" data-range="this_week">This week</button>
        <button type="button" data-range="next_week">Next week</button>
        <button type="button" data-range="week_after">Following</button>
        <button type="button" data-range="library">My shows</button>
      </nav>
      <div class="tools">
        <button type="button" id="btn-compact" class="icon-btn" title="Compact" aria-label="Compact">▣</button>
        <button type="button" id="btn-layout" class="icon-btn" title="Rows / Stacks" aria-label="Layout">
          <svg class="i-rows" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" rx="1.5"/>
            <rect x="11" y="1" width="8" height="8" rx="1.5"/>
            <rect x="1" y="11" width="8" height="8" rx="1.5"/>
            <rect x="11" y="11" width="8" height="8" rx="1.5"/>
          </svg>
          <svg class="i-stacks" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <rect x="1" y="6" width="5" height="13" rx="1.2"/>
            <rect x="7.5" y="1" width="5" height="18" rx="1.2"/>
            <rect x="14" y="4" width="5" height="15" rx="1.2"/>
          </svg>
        </button>
        <button type="button" id="btn-float" class="icon-btn" title="Float" aria-label="Float">⧉</button>
        <button type="button" id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </footer>
  </div>
  <aside id="drawer" class="drawer drawer-picker hidden">
    <div class="drawer-head">
      <h2>Add seasonal shows</h2>
      <button type="button" id="drawer-close">Close</button>
    </div>
    <div class="picker-bar">
      <select id="season-select"></select>
      <input id="search" type="search" placeholder="Search titles…" />
      <div class="seg" id="picker-layout">
        <button type="button" data-pick="tiles" class="active">Tiles</button>
        <button type="button" data-pick="rows">Rows</button>
      </div>
    </div>
    <div id="picker-grid" class="picker-grid tiles"></div>
    <div class="pager">
      <button type="button" id="page-prev">Prev</button>
      <span id="page-info"></span>
      <button type="button" id="page-next">Next</button>
    </div>
  </aside>
  <aside id="settings" class="drawer drawer-settings hidden">
    <div class="drawer-head">
      <h2>Widget settings</h2>
      <button type="button" id="settings-close">Close</button>
    </div>
    <form id="settings-form" class="settings-form">
      <button type="button" id="btn-add" class="primary">Add shows</button>
      <label>Layout
        <div class="select" data-name="layout">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="rows">Horizontal rows</li>
            <li data-value="stacks">Vertical stacks</li>
          </ul>
          <input type="hidden" name="layout" />
        </div>
      </label>
      <label>Stack poster
        <div class="select" data-name="stackPoster">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="bottom">Poster at bottom</li>
            <li data-value="top">Poster at top</li>
          </ul>
          <input type="hidden" name="stackPoster" />
        </div>
      </label>
      <label>Theme
        <div class="select" data-name="theme">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="dark">Dark widget</li>
            <li data-value="light">Light</li>
          </ul>
          <input type="hidden" name="theme" />
        </div>
      </label>
      <label>Title language
        <div class="select" data-name="titleLanguage">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="english">English</li>
            <li data-value="romaji">Romaji</li>
          </ul>
          <input type="hidden" name="titleLanguage" />
        </div>
      </label>
      <label>Episode tracks
        <div class="select" data-name="progressMode">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="split">Separate SUB and DUB rows</li>
            <li data-value="combined">Combined row</li>
          </ul>
          <input type="hidden" name="progressMode" />
        </div>
      </label>
      <div class="legend" id="combined-legend">
        <span class="swatch unaired"></span> Unaired
        <span class="swatch sub-aired"></span> Sub aired
        <span class="swatch dub-aired"></span> Dub aired
        <span class="swatch watched"></span> Watched
      </div>
      <label class="check"><input type="checkbox" name="showSub" /> Show sub counts</label>
      <label class="check"><input type="checkbox" name="showDub" /> Show English dub counts</label>
      <label class="check"><input type="checkbox" name="compact" /> Compact cards</label>
      <label>Week starts
        <div class="select" data-name="weekStart">
          <button type="button" class="select-btn"></button>
          <ul class="select-menu">
            <li data-value="sunday">Sunday</li>
            <li data-value="monday">Monday</li>
          </ul>
          <input type="hidden" name="weekStart" />
        </div>
      </label>
      <button type="submit" class="primary">Save</button>
      <div class="reload-row">
        <button type="button" id="btn-reload-ui">Reload UI</button>
        <button type="button" id="btn-reload-widget" class="primary">Reload widget</button>
      </div>
    </form>
  </aside>
  <div hidden>
    <span id="range-label"></span>
    <span id="season-chip"></span>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="hover-tip" class="hover-tip hidden"></div>
  <script src="/app.js"></script>
  <script src="/chrome.js"></script>
</body>
</html>
