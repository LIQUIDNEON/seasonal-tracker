<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seasonal Tracker</title>
  <link rel="stylesheet" href="/style.css?v=bar5" />
  <link rel="stylesheet" href="/compact.css?v=bar5" />
  <style>
    .statusbar { display:flex !important; flex-wrap:nowrap !important; align-items:center !important; justify-content:space-between !important; height:32px !important; overflow:hidden !important; }
    .statusbar .ranges { margin-right:auto !important; }
    .statusbar .tools { margin-left:auto !important; }
    .statusbar .ranges button { padding:2px 8px !important; font-size:11px !important; }
    #range-label,#season-chip,.bar-label,.season-chip,.statusline,#btn-minimal,#btn-compact,.poster-flip { display:none !important; }
    #btn-layout { font-size:0 !important; width:26px !important; }
    #btn-layout .i-bar { display:none; fill:currentColor; }
    #btn-layout .i-row { fill:currentColor; }
    #btn-layout.is-bar .i-row { display:none; }
    #btn-layout.is-bar .i-bar { display:block; }
    .week-strip { width:100% !important; }
    .week-strip:not(.week-rows) { display:flex !important; flex-direction:row !important; }
    .week-strip:not(.week-rows) .day-col { flex:1 1 0 !important; min-width:128px !important; overflow:visible !important; }
    .week-strip.week-rows { flex-direction:column !important; width:100% !important; }
    .row-card.compact,.stack-card.compact { width:140px !important; min-width:140px !important; max-width:160px !important; flex:1 1 140px !important; }
    .row-card.compact h4,.stack-card.compact h4 { display:-webkit-box !important; -webkit-line-clamp:3 !important; -webkit-box-orient:vertical !important; overflow:hidden !important; height:3.9em !important; }
    .day-col .cards:empty { min-height:48px; opacity:.45; }
    .drawer-settings { inset:auto 8px 40px auto !important; width:min(340px,94vw) !important; max-height:min(70vh,540px) !important; }
    .settings-form { overflow-y:auto; min-height:0; }
    .drawer-settings label:has([data-name="stackPoster"]),
    .drawer-settings label:has([name="compact"]) { display:none !important; }
  </style>
</head>
<body>
  <div id="app">
    <main id="board" class="board"></main>
    <footer class="statusbar" id="chrome">
      <nav class="ranges" id="ranges">
        <button type="button" data-range="today" class="active">Today</button>
        <button type="button" data-range="this_week">This week</button>
        <button type="button" data-range="next_week">Next week</button>
        <button type="button" data-range="week_after">Following</button>
        <button type="button" data-range="library">My shows</button>
      </nav>
      <div class="tools">
        <button type="button" id="btn-compact" hidden></button>
        <button type="button" id="btn-layout" class="icon-btn" title="Bar / Row">
          <svg class="i-row" viewBox="0 0 20 20" width="16" height="16"><rect x="1" y="3" width="18" height="3" rx="1"/><rect x="1" y="8.5" width="18" height="3" rx="1"/><rect x="1" y="14" width="18" height="3" rx="1"/></svg>
          <svg class="i-bar" viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="1" width="3" height="18" rx="1"/><rect x="8.5" y="1" width="3" height="18" rx="1"/><rect x="14" y="1" width="3" height="18" rx="1"/></svg>
        </button>
        <button type="button" id="btn-float" class="icon-btn" title="Float">⧉</button>
        <button type="button" id="btn-settings" class="icon-btn" title="Settings">⚙</button>
      </div>
    </footer>
  </div>
  <aside id="drawer" class="drawer drawer-picker hidden">
    <div class="drawer-head"><h2>Add seasonal shows</h2><button type="button" id="drawer-close">Close</button></div>
    <div class="picker-bar">
      <select id="season-select"></select>
      <input id="search" type="search" placeholder="Search titles…" />
      <div class="seg" id="picker-layout"><button type="button" data-pick="tiles" class="active">Tiles</button><button type="button" data-pick="rows">Rows</button></div>
    </div>
    <div id="picker-grid" class="picker-grid tiles"></div>
    <div class="pager"><button type="button" id="page-prev">Prev</button><span id="page-info"></span><button type="button" id="page-next">Next</button></div>
  </aside>
  <aside id="settings" class="drawer drawer-settings hidden">
    <div class="drawer-head"><h2>Widget settings</h2><button type="button" id="settings-close">Close</button></div>
    <form id="settings-form" class="settings-form">
      <button type="button" id="btn-add" class="primary">Add shows</button>
      <label>Layout<div class="select" data-name="layout"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="stacks">Bar — days across</li><li data-value="rows">Row — days down</li></ul><input type="hidden" name="layout" /></div></label>
      <label>Stack poster<div class="select" data-name="stackPoster"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="top">Poster at top</li><li data-value="bottom">Poster at bottom</li></ul><input type="hidden" name="stackPoster" /></div></label>
      <label>Theme<div class="select" data-name="theme"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="dark">Dark widget</li><li data-value="light">Light</li></ul><input type="hidden" name="theme" /></div></label>
      <label>Title language<div class="select" data-name="titleLanguage"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="english">English</li><li data-value="romaji">Romaji</li></ul><input type="hidden" name="titleLanguage" /></div></label>
      <label>Episode tracks<div class="select" data-name="progressMode"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="split">Separate SUB and DUB</li><li data-value="combined">Combined</li></ul><input type="hidden" name="progressMode" /></div></label>
      <div class="legend" id="combined-legend"><span class="swatch unaired"></span> Unaired <span class="swatch sub-aired"></span> Sub <span class="swatch dub-aired"></span> Dub <span class="swatch watched"></span> Watched</div>
      <label class="check"><input type="checkbox" name="showSub" /> Show sub counts</label>
      <label class="check"><input type="checkbox" name="showDub" /> Show English dub counts</label>
      <label class="check"><input type="checkbox" name="compact" /> Compact cards</label>
      <label>Week starts<div class="select" data-name="weekStart"><button type="button" class="select-btn"></button><ul class="select-menu"><li data-value="sunday">Sunday</li><li data-value="monday">Monday</li></ul><input type="hidden" name="weekStart" /></div></label>
      <button type="submit" class="primary">Save</button>
      <div class="reload-row"><button type="button" id="btn-reload-ui">Reload UI</button><button type="button" id="btn-reload-widget" class="primary">Reload widget</button></div>
    </form>
  </aside>
  <div hidden><span id="range-label"></span><span id="season-chip"></span></div>
  <div id="toast" class="toast hidden"></div>
  <div id="hover-tip" class="hover-tip hidden"></div>
  <script src="/app.js"></script>
  <script src="/chrome.js"></script>
</body>
</html>
